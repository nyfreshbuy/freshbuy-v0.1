<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>商品详情 - Freshbuy 在鲜购拼好货</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- 公共样式 -->
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
      /* ===== 详情页基础布局 ===== */
      .detail-page {
        max-width: 1200px;
        margin: 16px auto 40px;
        padding: 0 16px;
      }

      /* ===== 详情页推荐区：整排卡片 + 左右箭头 ===== */
      .detail-recommend-section {
        position: relative;
        margin-top: 32px;
      }

      .detail-recommend-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .detail-section-title {
        font-size: 16px;
        font-weight: 600;
      }

      .detail-recommend-viewport {
        overflow: hidden;
        padding: 4px 8px 12px;
      }

      .detail-recommend-track {
        display: flex;
        gap: 16px;
        scroll-behavior: smooth;
      }

      /* 单个推荐卡片（大图 + 文字 + 加入购物车） */
      .detail-recommend-card {
        flex: 0 0 320px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.10);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .detail-recommend-img-wrap {
        position: relative;
        width: 100%;
        padding-top: 62%;
        background: #f3f4f6;
        overflow: hidden;
      }

      .detail-recommend-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .detail-recommend-top-badge {
        position: absolute;
        left: 12px;
        top: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        background: #f97316;
        color: #fff;
      }

      .detail-recommend-body {
        padding: 10px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .detail-recommend-name {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 2px;
      }

      .detail-recommend-desc {
        font-size: 12px;
        color: #6b7280;
      }

      .detail-recommend-price-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-top: 4px;
      }

      .detail-recommend-price {
        font-size: 18px;
        font-weight: 700;
        color: #16a34a;
      }

      .detail-recommend-origin {
        font-size: 12px;
        text-decoration: line-through;
        color: #9ca3af;
      }

      .detail-recommend-bottom-row {
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .detail-recommend-fav-btn {
        border-radius: 999px;
        border: 1px solid #e5e7eb;
        background: #ffffff;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
      }

      .detail-recommend-add-btn {
        flex: 1;
        border-radius: 999px;
        border: none;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #ffffff;
        cursor: pointer;
      }

      /* 左右箭头按钮 */
      .detail-recommend-arrows {
        display: flex;
        gap: 6px;
      }

      .detail-rec-arrow {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        border: 1px solid #e5e7eb;
        background: #ffffff;
        font-size: 18px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .detail-rec-arrow:disabled {
        opacity: 0.4;
        cursor: default;
      }

      /* 窄屏时卡片变宽度 100%，箭头隐藏 */
      @media (max-width: 768px) {
        .detail-recommend-card {
          flex: 0 0 80%;
        }
        .detail-recommend-arrows {
          display: none;
        }
      }

      .detail-breadcrumb {
        font-size: 12px;
        color: #6b7280;
        margin-bottom: 10px;
      }
      .detail-breadcrumb a {
        color: #2563eb;
        text-decoration: none;
      }
      .detail-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr);
        gap: 24px;
      }
      @media (max-width: 900px) {
        .detail-layout {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .detail-image-box {
        background: #f3f4f6;
        border-radius: 16px;
        min-height: 260px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #6b7280;
        position: relative;
        overflow: hidden;
      }

      /* ✅ 新增：主图 */
      #detailImage {
        width: 100%;
        height: 100%;
        min-height: 260px;
        object-fit: cover;
        display: none;
      }

      .detail-tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .detail-tag {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #ecfdf3;
        color: #15803d;
      }
      .detail-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .detail-desc {
        font-size: 13px;
        color: #4b5563;
        margin-bottom: 10px;
      }
      .detail-price-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 8px;
      }
      .detail-price {
        font-size: 22px;
        font-weight: 700;
        color: #16a34a;
      }
      .detail-origin {
        font-size: 13px;
        text-decoration: line-through;
        color: #9ca3af;
      }
      .detail-extra-note {
        font-size: 12px;
        color: #fb923c;
        margin-bottom: 14px;
      }

      /* ===== 大胶囊加入购物车 + 收藏 ===== */
      .detail-cart-cta-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        margin-bottom: 10px;
      }

      .detail-big-cart-btn {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 999px;
        background: #06b6d4;
        background: linear-gradient(90deg, #0ea5e9, #06b6d4);
        color: #fff;
        padding: 8px 10px;
        cursor: pointer;
        border: none;

        /* ✅ 关键：徽章定位 */
        position: relative;
      }

      /* ✅ 新增：胶囊数量徽章 */
      #detailCartBadge {
        position: absolute;
        top: -8px;
        right: -8px;
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 999px;
        background: #ef4444;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        display: none;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 18px rgba(15,23,42,0.25);
      }

      .detail-big-cart-btn:active {
        transform: translateY(1px);
        box-shadow: 0 0 0 transparent;
      }
      .detail-big-cart-icon {
        border-radius: 999px;
        width: 32px;
        height: 32px;
        border: none;
        background: rgba(15, 23, 42, 0.15);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .detail-big-cart-text {
        flex: 1;
        padding: 0 8px;
        text-align: center;
      }
      .detail-big-cart-main {
        font-size: 14px;
        font-weight: 700;
      }
      .detail-big-cart-sub {
        font-size: 11px;
        opacity: 0.9;
      }
      .detail-fav-circle {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        border: 1px solid #e5e7eb;
        background: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .detail-small-note {
        font-size: 11px;
        color: #6b7280;
      }
      .detail-back-row {
        margin-top: 10px;
      }
      .detail-btn-secondary {
        border-radius: 999px;
        border: 1px solid #e5e7eb;
        padding: 8px 14px;
        font-size: 13px;
        background: #ffffff;
        cursor: pointer;
      }

      .detail-empty {
        font-size: 13px;
        color: #6b7280;
      }
    </style>
    <link rel="stylesheet" href="/shared/app-mobile.css?v=20260630-2" />
</head>
  <body>
    <!-- 顶部导航（复用） -->
    <div class="top-nav">
      <div class="top-nav-inner">
        <div class="logo-area">
          <div class="logo-badge">鲜</div>
          <div>
            <div class="logo-text-main">Freshbuy 在鲜购拼好货</div>
            <div class="logo-text-sub">
              新鲜草原区域 · 次日达 / 每周区域团配
            </div>
          </div>
        </div>

        <div class="search-area">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
              id="searchInput"
              class="search-input"
              placeholder="搜索商品，如：鸡腿、牛奶、苹果..."
            />
          </div>
        </div>

        <div class="user-area">
          <button class="link-btn">登录</button>
          <button class="link-btn primary">注册</button>

          <!-- ✅ 关键：加 id="cartIcon"，保持 onclick 不变 -->
          <div class="cart-icon" id="cartIcon" onclick="toggleCartDrawer()">
            🛒
            <span id="cartCount" class="cart-count-badge">0</span>
          </div>
        </div>
      </div>
    </div>

    <main class="detail-page">
      <div class="detail-breadcrumb">
        <a href="index.html">首页</a> /
        <span id="crumbProductName">商品详情</span>
      </div>

      <!-- 详情主体：两列布局 -->
      <div class="detail-layout">
        <!-- 左侧：图片 / 标签 -->
        <div class="detail-image-box">
          <!-- ✅ 新增：主图 -->
          <img id="detailImage" alt="商品图片" />
          <span id="detailImageText">商品图占位 · 后续接真实图片</span>
        </div>

        <!-- 右侧：标题 / 价格 / 大按钮 / 收藏 / 返回首页 -->
        <div>
          <div class="detail-tag-row" id="detailTagRow"></div>

          <div class="detail-title" id="detailTitle">加载中...</div>
          <div class="detail-desc" id="detailDesc"></div>

          <div class="detail-price-row">
            <span class="detail-price" id="detailPrice">$0.00</span>
            <span class="detail-origin" id="detailOrigin"></span>
          </div>

          <div class="detail-extra-note" id="detailExtraNote"></div>

          <!-- 数量 + 大胶囊加入购物车 + 收藏 -->
          <div class="detail-cart-cta-row">
            <!-- 大胶囊按钮（整个都是“加入购物车”） -->
            <div class="detail-big-cart-btn" id="btnAddToCartDetail" type="button">
              <!-- ✅ 新增：胶囊右上角徽章 -->
              <span id="detailCartBadge">0</span>

              <button class="detail-big-cart-icon" type="button" id="btnQtyMinusBig">−</button>

              <div class="detail-big-cart-text">
                <div class="detail-big-cart-main" id="detailCartMainText">加入 1 件商品</div>
                <div class="detail-big-cart-sub" id="detailCartSubText">点击中间区域加入购物车</div>
              </div>

              <button class="detail-big-cart-icon" type="button" id="btnQtyPlusBig">+</button>
            </div>

            <!-- 右侧圆形收藏按钮 -->
            <button class="detail-fav-circle" type="button" id="btnDetailFav">♡</button>
          </div>

          <div class="detail-small-note">
          </div>

          <div class="detail-back-row">
            <button class="detail-btn-secondary" type="button" onclick="window.location.href='index.html'">
              返回首页继续逛
            </button>
          </div>
        </div>
      </div>

      <!-- 推荐区：可左右滑动 -->
      <section class="detail-recommend-section">
        <div class="detail-recommend-header">
          <div class="detail-section-title">你可能还会想买</div>
          <div class="detail-recommend-arrows">
            <button type="button" class="detail-rec-arrow" id="recPrev">‹</button>
            <button type="button" class="detail-rec-arrow" id="recNext">›</button>
          </div>
        </div>

        <div class="detail-recommend-viewport">
          <div id="recommendList" class="detail-recommend-track"></div>
        </div>
      </section>
    </main>

    <!-- ✅ 购物车抽屉（对齐首页 cart.js 期望的 DOM） -->
<div class="cart-drawer-backdrop" id="cartBackdrop" onclick="toggleCartDrawer(false)"></div>

<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <span class="cart-title">购物车</span>
    <button class="cart-close" id="cartCloseBtn" onclick="toggleCartDrawer(false)">✕</button>
  </div>

  <div class="cart-body">
    <div class="cart-empty" id="cartEmptyText">购物车还是空的～</div>
    <div class="cart-items-list" id="cartItemsList"></div>
  </div>

  <div class="cart-footer">
    <div class="line">
      <span>商品总数</span>
      <span id="cartTotalItems">0 件</span>
    </div>

    <button class="btn-checkout" id="goCartBtn" type="button">
      去结算
    </button>
  </div>
</aside>
        <div class="shipping-modes">
          <div>选择配送模式：</div>
          <div class="mode-row">
            <label class="mode-pill-small">
              <input type="radio" name="shipMode" value="single" checked onchange="updateShippingMode()" />
              普通 4.99
            </label>
            <label class="mode-pill-small">
              <input type="radio" name="shipMode" value="friend" onchange="updateShippingMode()" />
              好友拼单
            </label>
            <label class="mode-pill-small">
              <input type="radio" name="shipMode" value="area" onchange="updateShippingMode()" />
              区域团免运费
            </label>
            <label class="mode-pill-small">
              <input type="radio" name="shipMode" value="pickup" onchange="updateShippingMode()" />
              自提点 0.99
            </label>
          </div>

          <div id="groupSizeWrap" class="group-size-select" style="display: none;">
            好友拼同一地址人数：
            <select id="groupSize" onchange="recalcCartTotals()">
              <option value="2">2 人</option>
              <option value="3">3 人</option>
              <option value="4">4 人</option>
            </select>
          </div>

          <div id="modeHintSmall" class="mode-hint-small">
            当前：普通配送，每单运费 $4.99。
          </div>
        </div>

        <button id="checkoutBtn" class="btn-checkout" onclick="submitOrder()" disabled>
          去结算（测试）
        </button>
        <div class="footer-note">
          当前为模式测试页面：下单信息会发送到测试后端，不会真实扣款。
        </div>
      </div>
    </div>

    <!-- 顶部“已加入购物车”提示条 -->
    <div id="addToCartToast" class="add-cart-toast"></div>

    <!-- 公共 JS + 详情页 JS（顺序不要改） -->
    <script src="assets/js/products.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/product_detail.js"></script>
    <script src="/user/components/footer.js"></script>
    <script src="/shared/app-mobile.js?v=20260630-2"></script>
</body>
</html>
