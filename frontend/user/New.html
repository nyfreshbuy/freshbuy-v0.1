<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>新品上市 - 在鲜购</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KP7J1LKVFJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-KP7J1LKVFJ');
</script>
  <link rel="stylesheet" href="/user/assets/css/main.css?v=10" />

  <style>
    /* =========================================================
       ✅ New 页终极固定栏：标题+购物车+分类条 一起固定在屏幕顶
       ✅ 滚动阴影（App 感）
       ✅ 购物车抽屉永远盖过固定栏（可点、不会被挡）
       ========================================================= */
    :root{
      --sticky-h: 140px;      /* JS 动态覆盖 */
      --app-shadow: 0 4px 12px rgba(15,23,42,.10);
    }

    /* iOS/微信：祖先有 transform 会让 fixed 跟着滚（本页兜底解除） */
    html, body{
      transform: none !important;
      filter: none !important;
      perspective: none !important;
      contain: none !important;
    }

    /* ✅ 顶部整体固定栏 */
    .new-sticky{
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 9000 !important;
      background:#fff !important;
      padding-top: env(safe-area-inset-top) !important;
      border-bottom: 1px solid #eef2f7 !important;
      transition: box-shadow .2s ease;
    }
    .new-sticky.is-scrolled{
      box-shadow: var(--app-shadow);
    }

    /* 顶部标题行 */
    .top-nav-inner{
      max-width:1400px;
      margin:0 auto;
      padding:10px 14px 8px;
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:space-between;
    }
    .logo-area{display:flex;align-items:center;gap:8px; cursor:pointer;}
    .logo-badge{
      width:32px;height:32px;border-radius:999px;
      background:radial-gradient(circle at 30% 30%, #22c55e, #16a34a);
      display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
      box-shadow: 0 8px 18px rgba(34,197,94,.20);
    }
    .logo-text-main{font-weight:900;}
    .right-actions{display:flex;align-items:center;gap:10px;}

    .back-home-btn{
      padding:8px 12px;border-radius:999px;border:1px solid #e5e7eb;
      background:#fff;font-size:13px;font-weight:700;cursor:pointer;
      white-space:nowrap;
    }

    /* 购物车图标 */
    .cart-icon{
      position:relative;width:38px;height:38px;border-radius:999px;
      background:#0f172a;display:flex;align-items:center;justify-content:center;
      color:#e5e7eb;cursor:pointer;
      box-shadow: 0 10px 18px rgba(15,23,42,.18);
    }
    .cart-count-badge{
      position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;
      font-size:10px;padding:0 6px;border-radius:999px;min-width:20px;
      text-align:center;display:none;
    }

    /* ✅ 分类条（在固定栏里） */
    .filter-wrap{
      max-width:1400px;
      margin:0 auto;
      padding:8px 14px 10px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      border-top:1px solid #f3f4f6;
      background:#fff;
    }
    .filter-bar{
      display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;
      -webkit-overflow-scrolling:touch;
      flex: 1 1 auto;
      min-width: 0;
    }
    .filter-bar::-webkit-scrollbar{display:none;}
    .filter-pill{
      flex:0 0 auto;padding:8px 12px;border-radius:999px;
      border:1px solid #e5e7eb;background:#fff;font-size:13px;
      cursor:pointer;white-space:nowrap;font-weight:800;
    }
    .filter-pill.active{
      border-color:rgba(34,197,94,.9);
      background:linear-gradient(135deg,#ecfdf3,#dcfce7);
      color:#15803d;font-weight:900;
    }

    .sort-box{
      flex:0 0 auto;display:flex;align-items:center;gap:6px;
      font-size:12px;color:#6b7280;white-space:nowrap;
    }
    .sort-select{
      padding:8px 10px;border-radius:10px;border:1px solid #e5e7eb;
      background:#fff;font-size:13px;outline:none;font-weight:800;
    }

    /* ✅ 主体：让位给固定栏 */
    main.page{
      max-width:1400px;
      margin:0 auto;
      padding:14px 14px 30px;
      padding-top: calc(env(safe-area-inset-top) + var(--sticky-h) + 12px) !important;
    }

    .page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 10px;}
    .page-title h2{margin:0;font-size:18px;}
    .page-title .sub{color:#6b7280;font-size:12px;}

    /* Toast：显示在固定栏下面 */
    .add-cart-toast{
      position:fixed;
      top: calc(env(safe-area-inset-top) + var(--sticky-h) + 10px);
      left:50%;
      transform:translateX(-50%) translateY(-16px);
      background:#111827;color:#f9fafb;padding:6px 14px;border-radius:999px;
      font-size:12px;box-shadow:0 8px 20px rgba(15,23,42,.4);
      opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
      z-index:12000;white-space:nowrap;
    }
    .add-cart-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* ✅ 本页兜底：加购按钮强制绿色（防止你说的“不变绿”） */
    .overlay-btn.add{
      background:#22c55e !important;
      color:#fff !important;
      border:none !important;
      font-weight:900 !important;
    }
    .product-add-fixed{
      background:#22c55e !important;
      color:#fff !important;
      border:none !important;
      font-weight:900 !important;
    }

    /* ✅ 购物车抽屉 DOM（本页内置，防止“点购物车没反应”） */
    .cart-backdrop{
      position:fixed; inset:0;
      background:rgba(15,23,42,.45);
      display:none;
      z-index: 20000;
    }
    .cart-backdrop.active{display:block;}
    .cart-drawer{
      position:fixed;
      right:0; top:0;
      width:360px; max-width:92vw; height:100vh;
      background:#fff;
      box-shadow:-12px 0 30px rgba(15,23,42,.18);
      transform:translateX(110%);
      transition:transform .25s ease;
      z-index: 20001;
      display:flex; flex-direction:column;
      border-left:1px solid #eef2f7;
    }
    .cart-drawer.active{transform:translateX(0);}
    .cart-drawer-header{
      padding:12px;
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid #eef2f7;
      font-weight:900;
    }
    .cart-close-btn{
      width:36px;height:36px;border-radius:12px;border:1px solid #e5e7eb;
      background:#fff;cursor:pointer;font-weight:900;
    }
    .cart-drawer-body{padding:12px;overflow:auto;flex:1;}
    .cart-items{display:flex;flex-direction:column;gap:10px;}
    .cart-drawer-footer{padding:12px;border-top:1px solid #eef2f7;}
    .cart-go-btn{
      width:100%;height:46px;border:none;border-radius:14px;
      background:#0f172a;color:#fff;font-weight:900;cursor:pointer;
    }

    @media (max-width:520px){
      .top-nav-inner{padding:10px 12px 8px;}
      .filter-wrap{padding:8px 12px 10px;}
      main.page{padding-left:12px;padding-right:12px;}
    }
    /* =========================
   ✅ FIX: New 页“加入购物车”字号偏小
   只影响 renderer 的按钮
   ========================= */
#newGrid .product-add-fixed,
#newGrid .overlay-btn.add,
#newGrid button[data-action="add-to-cart"],
#newGrid button[data-action="add"],
#newGrid .add-btn{
  height: 46px !important;
  min-height: 46px !important;
  font-size: 16px !important;
  font-weight: 900 !important;
  line-height: 46px !important;
  border-radius: 14px !important;
}

/* 有些 renderer 用 span 包字，这里一起兜底 */
#newGrid .product-add-fixed *,
#newGrid .overlay-btn.add *,
#newGrid .add-btn__text{
  font-size: 16px !important;
  font-weight: 900 !important;
}

/* 让按钮更“分类页同款” */
#newGrid .product-add-fixed,
#newGrid .overlay-btn.add,
#newGrid .add-btn{
  background: #22c55e !important;
  color: #fff !important;
  border: none !important;
}
  </style>
  <link rel="stylesheet" href="/shared/app-mobile.css?v=20260630-2" />
</head>

<body>

  <!-- ✅ 顶部固定栏（标题+购物车+分类条） -->
  <header class="new-sticky" id="newSticky">
    <div class="top-nav-inner">
      <div class="logo-area" onclick="location.href='/user/index.html'">
        <div class="logo-badge">鲜</div>
        <div>
          <div class="logo-text-main">新品上市专区</div>
          <div style="font-size:11px;color:#6b7280;">NEW · 新上架 · 试吃推荐</div>
        </div>
      </div>

      <div class="right-actions">
        <button type="button" class="back-home-btn" onclick="location.href='/user/index.html'">
          ← 返回首页
        </button>

        <div class="cart-icon" id="cartIcon" title="打开购物车">
          🛒 <span class="cart-count-badge" id="cartCount">0</span>
        </div>
      </div>
    </div>

    <div class="filter-wrap">
      <div class="filter-bar" id="filterBar"></div>
      <div class="sort-box">
        <span>排序</span>
        <select class="sort-select" id="sortSelect">
          <option value="newest_desc">最新上架</option>
          <option value="sales_desc">销量高 → 低</option>
          <option value="price_asc">价格低 → 高</option>
          <option value="price_desc">价格高 → 低</option>
        </select>
      </div>
    </div>
  </header>

  <div class="add-cart-toast" id="addCartToast">已加入购物车</div>

  <main class="page">
    <div class="page-title">
      <div>
        <h2>🆕 新品上市</h2>
        <div class="sub">只展示新品/新上架/NEW 等标签或 isNew 标记的商品</div>
      </div>
    </div>

    <div class="product-grid" id="newGrid"></div>
  </main>

  <!-- ✅ 购物车抽屉 DOM（必须存在，cart.js 才能绑定打开/关闭） -->
  <div class="cart-backdrop" id="cartBackdrop"></div>

  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-drawer-header">
      <div>购物车</div>
      <button type="button" class="cart-close-btn" id="cartCloseBtn">✕</button>
    </div>

    <div class="cart-drawer-body">
      <div style="font-size:12px;color:#6b7280;margin-bottom:10px;">
        共 <span id="cartTotalItems">0</span> 件
      </div>

      <div id="cartEmptyText" style="display:none;color:#6b7280;font-size:13px;padding:10px 0;">
        购物车还是空的，快去挑点好东西～
      </div>

      <div class="cart-items" id="cartItemsList"></div>
    </div>

    <div class="cart-drawer-footer">
      <button type="button" class="cart-go-btn" id="goCartBtn">去购物车结算</button>
    </div>
  </aside>

  <!-- ✅ 脚本顺序：renderer → cart → page（确保 FBCard 和 FreshCart 都能工作） -->
  <script src="/user/assets/js/product_card_renderer.js?v=2"></script>
  <script src="/user/assets/js/cart.js?v=10"></script>
  <script src="/user/assets/js/New.js?v=2"></script>

  <!-- ✅ 自动计算固定栏高度 + 滚动阴影 -->
  <script>
    (function () {
      const sticky = document.getElementById("newSticky");
      if (!sticky) return;

      function applyHeight() {
        const h = Math.ceil(sticky.getBoundingClientRect().height || 0);
        document.documentElement.style.setProperty("--sticky-h", h + "px");
      }
      function onScroll() {
        if (window.scrollY > 4) sticky.classList.add("is-scrolled");
        else sticky.classList.remove("is-scrolled");
      }

      applyHeight();
      onScroll();

      window.addEventListener("resize", applyHeight, { passive: true });
      window.addEventListener("orientationchange", applyHeight, { passive: true });
      window.addEventListener("scroll", onScroll, { passive: true });

      setTimeout(applyHeight, 60);
      setTimeout(applyHeight, 240);
    })();
  </script>
  <script src="/shared/app-mobile.js?v=20260630-2"></script>
</body>
</html>
