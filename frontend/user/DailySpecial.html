<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>家庭必备 - 在鲜购</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KP7J1LKVFJ"></script>

  <link rel="stylesheet" href="./assets/css/main.css?v=10" />

  <style>
    :root{
      --sticky-h: 120px; /* JS 动态覆盖 */
      --app-shadow: 0 4px 12px rgba(15,23,42,.10);
    }

    /* iOS/微信：祖先 transform/filter/perspective 可能让 fixed 变“跟随滚动” */
    html, body{
      transform: none !important;
      filter: none !important;
      perspective: none !important;
      contain: none !important;
    }

    /* ===============================
       ✅ 顶部固定壳：标题栏 + 分类条
       =============================== */
    .daily-sticky{
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 9000 !important; /* 顶部固定栏（低于购物车抽屉） */
      background: #fff !important;

      /* iPhone 刘海安全区 */
      padding-top: env(safe-area-inset-top) !important;

      transition: box-shadow .2s ease;
      border-bottom: 1px solid #eef2f7;
    }
    .daily-sticky.is-scrolled{
      box-shadow: var(--app-shadow);
    }

    /* ======================
       顶部标题栏（含购物车）
       ====================== */
    .top-title{
      background:#fff;
    }
    .top-title-inner{
      max-width:1400px;
      margin:0 auto;
      padding:12px 14px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .logo-area{
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
    }
    .logo-badge{
      width:40px;height:40px;border-radius:999px;
      background: radial-gradient(circle at 30% 30%, #22c55e, #16a34a);
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:900;font-size:18px;
      box-shadow: 0 8px 18px rgba(34,197,94,.22);
    }
    .logo-text-main{font-weight:900; font-size:18px; line-height:1.1;}
    .logo-sub{font-size:12px;color:#6b7280; margin-top:3px;}

    .right-actions{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .back-home-btn{
      padding:10px 14px;
      border-radius:999px;
      border:1px solid #e5e7eb;
      background:#fff;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      white-space:nowrap;
    }

    .cart-icon{
      position:relative;
      width:46px;height:46px;border-radius:16px;
      background:#0f172a;
      display:flex;align-items:center;justify-content:center;
      color:#e5e7eb;
      cursor:pointer;
      user-select:none;
      box-shadow: 0 10px 18px rgba(15,23,42,.18);
      font-size:18px;
    }
    .cart-count-badge{
      position:absolute; top:-6px; right:-6px;
      background:#ef4444;
      color:#fff;
      font-size:11px;
      padding:2px 7px;
      border-radius:999px;
      min-width:22px;
      text-align:center;
      display:none;
      box-shadow: 0 6px 14px rgba(239,68,68,.25);
    }

    /* ======================
       分类条（pills + 排序）
       ====================== */
    .filter-wrap{
      background:#fff;
      border-top:1px solid #f3f4f6;
    }
    .filter-wrap-inner{
      max-width:1400px;
      margin:0 auto;
      padding:10px 14px 12px;
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
    }

    .filter-bar{
      display:flex;
      gap:10px;
      overflow-x:auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom:2px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .filter-bar::-webkit-scrollbar{display:none;}

    .filter-pill{
      flex:0 0 auto;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid #e5e7eb;
      background:#fff;
      font-size:14px;
      cursor:pointer;
      white-space:nowrap;
      font-weight:800;
    }
    .filter-pill.active{
      border-color:rgba(34,197,94,.9);
      background:linear-gradient(135deg,#ecfdf3,#dcfce7);
      color:#15803d;
      font-weight:900;
    }

    .sort-box{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      color:#6b7280;
      white-space:nowrap;
    }
    .sort-select{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid #e5e7eb;
      background:#fff;
      font-size:14px;
      outline:none;
      font-weight:900;
    }

    /* ======================
       Toast（在固定栏下方）
       ====================== */
    .add-cart-toast{
      position:fixed;
      top: calc(env(safe-area-inset-top) + var(--sticky-h) + 10px);
      left:50%;
      transform:translateX(-50%) translateY(-16px);
      background:#111827;
      color:#f9fafb;
      padding:7px 14px;
      border-radius:999px;
      font-size:12px;
      box-shadow:0 10px 22px rgba(15,23,42,.35);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 12000; /* 比顶部栏高，避免被遮 */
      white-space:nowrap;
    }
    .add-cart-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

    /* ======================
       页面主体：给顶部固定栏让位
       ====================== */
    main.page{
      max-width:1400px;
      margin:0 auto;
      padding: 14px 14px 30px;
      padding-top: calc(env(safe-area-inset-top) + var(--sticky-h) + 12px) !important;
    }

    .page-title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      margin:8px 0 12px;
    }
    .page-title h2{margin:0; font-size:18px;}
    .page-title .sub{color:#6b7280; font-size:12px;}

    /* ✅ 本页兜底：renderer 的加入购物车按钮强制绿色 */
    .product-add-fixed{
      background:#22c55e !important;
      color:#fff !important;
      border:none !important;
      border-radius:14px !important;
      font-weight:900 !important;
      height:46px !important;
    }
    .product-add-fixed:disabled{opacity:.55 !important;}
    .overlay-btn.add{
      background:#22c55e !important;
      color:#fff !important;
      border:none !important;
      font-weight:900 !important;
    }
    .overlay-btn.add:disabled{opacity:.55 !important;}

    /* ======================
       ✅ 购物车抽屉：永远盖过顶部固定栏
       ====================== */
    .cart-backdrop{
      position:fixed; inset:0;
      background:rgba(15,23,42,.45);
      display:none;
      z-index: 20000; /* > 9000 */
    }
    .cart-backdrop.active{display:block;}

    .cart-drawer{
      position:fixed;
      right:0;
      top:0;
      height:100vh;
      width:360px;
      max-width:92vw;
      background:#fff;
      box-shadow:-12px 0 30px rgba(15,23,42,.18);
      transform:translateX(110%);
      transition:transform .25s ease;
      z-index: 20001; /* > backdrop */
      display:flex;
      flex-direction:column;
      border-left:1px solid #eef2f7;
    }
    .cart-drawer.active{transform:translateX(0);}

    .cart-drawer-header{
      padding:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid #eef2f7;
    }
    .cart-close-btn{
      width:36px;height:36px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      background:#fff;
      cursor:pointer;
      font-weight:900;
    }

    .cart-drawer-body{padding:12px; overflow:auto; flex:1;}
    .cart-empty{padding:12px; color:#6b7280; font-size:13px;}
    .cart-items{display:flex; flex-direction:column; gap:10px;}
    .cart-drawer-footer{padding:12px; border-top:1px solid #eef2f7;}
    .cart-go-btn{
      width:100%;
      height:46px;
      border:none;
      border-radius:14px;
      background:#0f172a;
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }

    @media (max-width: 520px){
      .top-title-inner{padding:12px 12px 10px;}
      .filter-wrap-inner{padding:10px 12px 12px;}
      main.page{padding-left:12px; padding-right:12px;}
    }
  </style>
  <link rel="stylesheet" href="/shared/app-mobile.css?v=20260630-2" />
</head>

<body class="page-daily">

  <!-- ✅ 顶部固定栏：标题 + 分类条 -->
  <div class="daily-sticky" id="dailySticky">
    <div class="top-title">
      <div class="top-title-inner">
        <div class="logo-area" onclick="location.href='/user/index.html'">
          <div class="logo-badge">鲜</div>
          <div>
            <div class="logo-text-main">家庭必备专区</div>
            <div class="logo-sub">常备清单 · 高频复购 · 一站补齐</div>
          </div>
        </div>

        <div class="right-actions">
          <button type="button" class="back-home-btn" onclick="location.href='/user/index.html'">
            ← 返回首页
          </button>

          <div class="cart-icon" id="cartIcon" title="打开购物车">
            🛒
            <span class="cart-count-badge" id="cartCount">0</span>
          </div>
        </div>
      </div>
    </div>

    <div class="filter-wrap" id="filterWrap">
      <div class="filter-wrap-inner">
        <div class="filter-bar" id="filterBar"></div>

        <div class="sort-box">
          <span>排序</span>
          <select class="sort-select" id="sortSelect">
            <option value="sales_desc">销量高 → 低</option>
            <option value="price_asc">价格低 → 高</option>
            <option value="price_desc">价格高 → 低</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="add-cart-toast" id="addCartToast">已加入购物车</div>

  <main class="page">
    <div class="page-title">
      <div>
        <h2>🏠 家庭必备</h2>
        <div class="sub">家庭必备 = 所有特价商品（后台开启特价即可出现）</div>
      </div>
    </div>

    <div class="product-grid" id="dailyGrid"></div>
  </main>

  <!-- ✅ 购物车抽屉 DOM -->
  <div class="cart-backdrop" id="cartBackdrop"></div>

  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-drawer-header">
      <div style="font-weight:900;">购物车</div>
      <button type="button" class="cart-close-btn" id="cartCloseBtn">✕</button>
    </div>

    <div class="cart-drawer-body">
      <div style="font-size:12px;color:#6b7280; margin-bottom:10px;">
        共 <span id="cartTotalItems">0</span> 件
      </div>

      <div class="cart-empty" id="cartEmptyText" style="display:none;">
        购物车还是空的，快去挑点好东西～
      </div>

      <div class="cart-items" id="cartItemsList"></div>
    </div>

    <div class="cart-drawer-footer">
      <button type="button" class="cart-go-btn" id="goCartBtn">去购物车结算</button>
    </div>
  </aside>

  <!-- ✅ 脚本顺序：cart → renderer → page -->
  <script src="/user/assets/js/cart.js?v=10"></script>
  <script src="/user/assets/js/product_card_renderer.js?v=2"></script>
  <script src="/user/assets/js/DailySpecial.js?v=3"></script>

  <!-- ✅ 自动计算“顶部固定栏”高度，给 main.page 让位 + 滚动阴影 -->
  <script>
    (function () {
      const sticky = document.getElementById("dailySticky");
      if (!sticky) return;

      function applyHeight() {
        const h = Math.ceil(sticky.getBoundingClientRect().height || 0);
        document.documentElement.style.setProperty("--sticky-h", h + "px");
      }

      function onScroll() {
        if (window.scrollY > 4) sticky.classList.add("is-scrolled");
        else sticky.classList.remove("is-scrolled");
      }

      applyHeight();
      onScroll();

      window.addEventListener("resize", applyHeight, { passive: true });
      window.addEventListener("orientationchange", applyHeight, { passive: true });
      window.addEventListener("scroll", onScroll, { passive: true });

      setTimeout(applyHeight, 60);
      setTimeout(applyHeight, 240);
    })();
  </script>

  <script src="/shared/app-mobile.js?v=20260630-2"></script>
</body>
</html>
