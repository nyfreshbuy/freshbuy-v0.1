<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>畅销产品 - 在鲜购</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KP7J1LKVFJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KP7J1LKVFJ');
</script>
  <link rel="stylesheet" href="/user/assets/css/main.css?v=10" />

  <style>
    :root{
      --best-top-h: 120px;          /* JS 会动态写入真实高度 */
      --app-shadow: 0 6px 16px rgba(15,23,42,.10);
    }

    /* ✅ iOS/微信：祖先有 transform 会导致 fixed 失效（跟着滚） */
    html, body{
      transform:none !important;
      filter:none !important;
      perspective:none !important;
    }

    /* =========================
       顶部两排：固定在屏幕里
       ========================= */
    header.top-nav{
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 9999 !important;

      background:#fff;
      border-bottom:1px solid #eef2f7;

      /* iPhone 刘海安全区 */
      padding-top: env(safe-area-inset-top);

      transition: box-shadow .2s ease;
    }
    header.top-nav.is-scrolled{
      box-shadow: var(--app-shadow);
    }

    .top-nav-inner{
      max-width: 1400px;
      margin:0 auto;
      padding:10px 14px;
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:space-between;
    }

    .logo-area{display:flex; align-items:center; gap:8px;}
    .logo-badge{
      width:32px;height:32px;border-radius:999px;
      background: radial-gradient(circle at 30% 30%, #22c55e, #16a34a);
      display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
    }
    .logo-text-main{font-weight:800;}

    .right-actions{display:flex; align-items:center; gap:10px;}
    .cart-icon{
      position:relative;
      width:38px;height:38px;border-radius:999px;
      background:#0f172a;
      display:flex;align-items:center;justify-content:center;
      color:#e5e7eb; cursor:pointer;
      user-select:none;
    }
    .cart-count-badge{
      position:absolute; top:-4px; right:-4px;
      background:#ef4444; color:#fff; font-size:10px; padding:0 6px;
      border-radius:999px; min-width:20px; text-align:center; display:none;
    }

    /* 第二排：分类 pills + 排序 */
    .filter-wrap{
      max-width:1400px;
      margin:0 auto;
      padding:8px 14px 10px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      border-top:1px solid #f3f4f6;
      background:#fff;
    }
    .filter-bar{
      display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-bar::-webkit-scrollbar{display:none;}
    .filter-pill{
      flex:0 0 auto;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid #e5e7eb;
      background:#fff;
      font-size:13px;
      cursor:pointer;
      white-space:nowrap;
    }
    .filter-pill.active{
      border-color:rgba(34,197,94,.9);
      background:linear-gradient(135deg,#ecfdf3,#dcfce7);
      color:#15803d;
      font-weight:800;
    }

    .sort-box{
      flex:0 0 auto;
      display:flex; align-items:center; gap:6px;
      font-size:12px; color:#6b7280;
      white-space:nowrap;
    }
    .sort-select{
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #e5e7eb;
      background:#fff;
      font-size:13px;
      outline:none;
    }

    /* 主体让位（给 fixed 顶部两排） */
    .page{
      max-width:1400px;
      margin:0 auto;
      padding:14px 14px 30px;
      padding-top: calc(var(--best-top-h) + 10px) !important;
    }
    .page-title{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin:6px 0 10px;}
    .page-title h2{margin:0; font-size:18px;}
    .page-title .sub{color:#6b7280; font-size:12px;}

    /* Toast */
    .add-cart-toast{
      position:fixed;
      top: calc(env(safe-area-inset-top) + 70px);
      left:50%;
      transform:translateX(-50%) translateY(-16px);
      background:#111827; color:#f9fafb;
      padding:6px 14px; border-radius:999px; font-size:12px;
      box-shadow:0 8px 20px rgba(15,23,42,.4);
      opacity:0; pointer-events:none;
      transition: opacity .25s ease, transform .25s ease;
      z-index:10000; white-space:nowrap;
    }
    .add-cart-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

    /* 购物车抽屉（Best 页必须有这些 DOM，否则点右上角无反应） */
    .cart-backdrop{
      position:fixed; inset:0;
      background:rgba(15,23,42,.45);
      display:none;
      z-index: 9998;
    }
    .cart-backdrop.active{display:block;}

    .cart-drawer{
      position:fixed;
      right:0;
      top:0;
      height:100vh;
      width:360px;
      max-width:92vw;
      background:#fff;
      box-shadow:-12px 0 30px rgba(15,23,42,.18);
      transform:translateX(110%);
      transition:transform .25s ease;
      z-index: 9999;
      display:flex;
      flex-direction:column;
      border-left:1px solid #eef2f7;
    }
    .cart-drawer.active{transform:translateX(0);}

    .cart-drawer-header{
      padding:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid #eef2f7;
    }
    .cart-close-btn{
      width:36px;height:36px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      background:#fff;
      cursor:pointer;
      font-weight:900;
    }

    .cart-drawer-body{padding:12px; overflow:auto; flex:1;}
    .cart-empty{padding:12px; color:#6b7280; font-size:13px;}
    .cart-items{display:flex; flex-direction:column; gap:10px;}
    .cart-drawer-footer{padding:12px; border-top:1px solid #eef2f7;}
    .cart-go-btn{
      width:100%;
      height:46px;
      border:none;
      border-radius:14px;
      background:#0f172a;
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }
  </style>
  <link rel="stylesheet" href="/shared/app-mobile.css?v=20260630-2" />
</head>

<body>
  <header class="top-nav" id="bestTopNav">
    <div class="top-nav-inner">
      <div class="logo-area" onclick="location.href='/user/index.html'" style="cursor:pointer;">
        <div class="logo-badge">鲜</div>
        <div>
          <div class="logo-text-main">畅销产品专区</div>
          <div style="font-size:11px;color:#6b7280;">TOP 热销 · 口碑之选 · 回购最多</div>
        </div>
      </div>

      <div class="right-actions">
        <button
          type="button"
          onclick="location.href='/user/index.html'"
          style="padding:8px 12px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-size:13px;font-weight:600;cursor:pointer;"
        >
          ← 返回首页
        </button>

        <div class="cart-icon" id="cartIcon" title="打开购物车">
          🛒
          <span class="cart-count-badge" id="cartCount">0</span>
        </div>
      </div>
    </div>

    <div class="filter-wrap">
      <div class="filter-bar" id="filterBar"></div>
      <div class="sort-box">
        <span>排序</span>
        <select class="sort-select" id="sortSelect">
          <option value="sales_desc">销量高 → 低</option>
          <option value="price_asc">价格低 → 高</option>
          <option value="price_desc">价格高 → 低</option>
        </select>
      </div>
    </div>
  </header>

  <div class="add-cart-toast" id="addCartToast">已加入购物车</div>

  <main class="page">
    <div class="page-title">
      <div>
        <h2>🏆 畅销产品</h2>
        <div class="sub">只展示畅销/热销/Top/Best 等标签或 isBest 标记的商品</div>
      </div>
    </div>

    <div class="product-grid" id="bestGrid"></div>
  </main>

  <!-- ✅ 购物车抽屉 DOM（必须有） -->
  <div class="cart-backdrop" id="cartBackdrop"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-drawer-header">
      <div style="font-weight:900;">购物车</div>
      <button type="button" class="cart-close-btn" id="cartCloseBtn">✕</button>
    </div>

    <div class="cart-drawer-body">
      <div style="font-size:12px;color:#6b7280; margin-bottom:10px;">
        共 <span id="cartTotalItems">0</span> 件
      </div>

      <div class="cart-empty" id="cartEmptyText" style="display:none;">
        购物车还是空的，快去挑点好东西～
      </div>

      <div class="cart-items" id="cartItemsList"></div>
    </div>

    <div class="cart-drawer-footer">
      <button type="button" class="cart-go-btn" id="goCartBtn">去购物车结算</button>
    </div>
  </aside>

  <!-- ✅ 顺序必须：cart → renderer → Best -->
  <script src="/user/assets/js/cart.js?v=10"></script>
  <script src="/user/assets/js/product_card_renderer.js?v=2"></script>
  <script src="/user/assets/js/Best.js?v=1"></script>

  <!-- ✅ 自动计算固定顶部高度 + 滚动阴影 -->
  <script>
    (function () {
      const top = document.getElementById("bestTopNav");
      if (!top) return;

      function applyHeight(){
        const h = Math.ceil(top.getBoundingClientRect().height || 0);
        document.documentElement.style.setProperty("--best-top-h", h + "px");
      }
      function onScroll(){
        if (window.scrollY > 4) top.classList.add("is-scrolled");
        else top.classList.remove("is-scrolled");
      }

      applyHeight();
      onScroll();

      window.addEventListener("resize", applyHeight, { passive: true });
      window.addEventListener("orientationchange", applyHeight, { passive: true });
      window.addEventListener("scroll", onScroll, { passive: true });
    })();
  </script>
  <script src="/shared/app-mobile.js?v=20260630-2"></script>
</body>
</html>
