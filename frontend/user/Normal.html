<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>全部商品- 在鲜购</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KP7J1LKVFJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-KP7J1LKVFJ');
</script>
  <link rel="stylesheet" href="/user/assets/css/main.css?v=11" />

  <style>
    :root{
      --nav-shadow: 0 6px 16px rgba(15,23,42,.10);
      --sticky-h: 0px;
    }

    /* ✅ 顶部两排固定：标题/购物车 + 分类/排序 */
    .top-nav{
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 99990;
      background:#fff;
      border-bottom:1px solid #eef2f7;
      padding-top: env(safe-area-inset-top);
      transition: box-shadow .2s ease;
    }
    .top-nav.is-scrolled{ box-shadow: var(--nav-shadow); }

    .top-nav-inner{
      max-width: 1400px; margin:0 auto; padding:10px 14px;
      display:flex; align-items:center; gap:12px; justify-content:space-between;
    }
    .logo-area{display:flex; align-items:center; gap:8px;}
    .logo-badge{
      width:32px;height:32px;border-radius:999px;
      background: radial-gradient(circle at 30% 30%, #22c55e, #16a34a);
      display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;
    }
    .logo-text-main{font-weight:900;}
    .right-actions{display:flex; align-items:center; gap:10px;}

    .cart-icon{
      position:relative; width:42px;height:42px;border-radius:16px;
      background:#0f172a; display:flex;align-items:center;justify-content:center;
      color:#e5e7eb; cursor:pointer; user-select:none;
      box-shadow: 0 10px 18px rgba(15,23,42,.18);
    }
    .cart-count-badge{
      position:absolute; top:-6px; right:-6px;
      background:#ef4444; color:#fff; font-size:11px; padding:2px 7px;
      border-radius:999px; min-width:22px; text-align:center; display:none;
      box-shadow: 0 6px 14px rgba(239,68,68,.25);
    }

    .filter-wrap{
      max-width:1400px; margin:0 auto; padding:8px 14px 12px;
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      border-top:1px solid #f3f4f6;
    }
    .filter-bar{
      display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;
      -webkit-overflow-scrolling: touch;
      flex: 1 1 auto;
    }
    .filter-bar::-webkit-scrollbar{display:none;}
    .filter-pill{
      flex:0 0 auto;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid #e5e7eb;
      background:#fff;
      font-size:13px;
      cursor:pointer;
      white-space:nowrap;
      font-weight:800;
    }
    .filter-pill.active{
      border-color:rgba(34,197,94,.9);
      background:linear-gradient(135deg,#ecfdf3,#dcfce7);
      color:#15803d;
      font-weight:900;
    }

    .sort-box{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280;white-space:nowrap;}
    .sort-select{padding:8px 10px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-size:13px;outline:none;font-weight:900;}

    /* ✅ 主体让位：给 fixed 顶部两排 */
    main.page{
      max-width:1400px;
      margin:0 auto;
      padding:14px 14px 30px;
      padding-top: calc(var(--sticky-h) + 12px);
    }

    .page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 10px;}
    .page-title h2{margin:0;font-size:18px;}
    .page-title .sub{color:#6b7280;font-size:12px;}

    /* ✅ Toast（首页同款） */
    .add-cart-toast{
      position:fixed;
      top: calc(env(safe-area-inset-top) + 72px);
      left:50%;
      transform:translateX(-50%) translateY(-16px);
      background:#111827;
      color:#f9fafb;
      padding:7px 14px;
      border-radius:999px;
      font-size:12px;
      box-shadow:0 10px 22px rgba(15,23,42,.35);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease, transform .25s ease;
      z-index:999999;
      white-space:nowrap;
    }
    .add-cart-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

    /* =========================================================
       ✅ 关键修复：灰屏遮罩/抽屉层级
       - 遮罩 z-index 必须 < 抽屉
       - 抽屉 active 必须 transform 进屏
       ========================================================= */
    #cartBackdrop{
      position:fixed; inset:0;
      background:rgba(15,23,42,.45);
      display:none;
      z-index: 999970; /* ✅ 比抽屉低 */
    }
    #cartBackdrop.active{ display:block; }

    #cartDrawer{
      position:fixed;
      right:0;
      top:0;
      height:100vh;
      width:360px;
      max-width:92vw;
      background:#fff;
      box-shadow:-12px 0 30px rgba(15,23,42,.18);
      transform:translateX(110%);
      transition:transform .25s ease;
      z-index: 999980; /* ✅ 比遮罩高 */
      display:flex; flex-direction:column;
      border-left:1px solid #eef2f7;
    }
    #cartDrawer.active{ transform:translateX(0); }

    .cart-drawer-header{
      padding:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid #eef2f7;
    }
    .cart-close-btn{
      width:36px;height:36px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      background:#fff;
      cursor:pointer;
      font-weight:900;
    }
    .cart-drawer-body{padding:12px; overflow:auto; flex:1;}
    .cart-empty{padding:12px; color:#6b7280; font-size:13px;}
    .cart-items{display:flex; flex-direction:column; gap:10px;}
    .cart-drawer-footer{padding:12px; border-top:1px solid #eef2f7;}
    .cart-go-btn{
      width:100%;
      height:46px;
      border:none;
      border-radius:14px;
      background:#0f172a;
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }

    @media (max-width: 520px){
      .top-nav-inner{padding:10px 12px;}
      .filter-wrap{padding:8px 12px 12px;}
      main.page{padding-left:12px; padding-right:12px;}
    }
  </style>
  <link rel="stylesheet" href="/shared/app-mobile.css?v=20260630-2" />
</head>

<body>
  <!-- ✅ 顶部两排固定 -->
  <header class="top-nav" id="topNav">
    <div class="top-nav-inner">
      <div class="logo-area" onclick="location.href='/user/index.html'" style="cursor:pointer;">
        <div class="logo-badge">鲜</div>
        <div>
          <div class="logo-text-main">全部商品</div>
          <div style="font-size:11px;color:#6b7280;">Normal · 全部可买</div>
        </div>
      </div>

      <div class="right-actions">
        <button type="button" onclick="location.href='/user/index.html'"
          style="padding:8px 12px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-size:13px;font-weight:700;cursor:pointer;">
          ← 返回首页
        </button>

        <div class="cart-icon" id="cartIcon" title="打开购物车">
          🛒 <span class="cart-count-badge" id="cartCount">0</span>
        </div>
      </div>
    </div>

    <div class="filter-wrap">
      <div class="filter-bar" id="filterBar"></div>
      <div class="sort-box">
        <span>排序</span>
        <select class="sort-select" id="sortSelect">
          <option value="sales_desc">销量高 → 低</option>
          <option value="price_asc">价格低 → 高</option>
          <option value="price_desc">价格高 → 低</option>
        </select>
      </div>
    </div>
  </header>

  <div class="add-cart-toast" id="addCartToast">已加入购物车</div>

  <main class="page">
    <div class="page-title">
      <div>
        <h2>🧺 全部商品</h2>
        <div class="sub">本页展示：除“爆品/Hot”外所有商品（含单卖/整箱拆卡）</div>
      </div>
    </div>

    <div class="product-grid" id="normalGrid"></div>
  </main>

  <!-- ✅ 购物车抽屉 DOM（必须有，否则会出现“只灰屏不出抽屉”） -->
  <div id="cartBackdrop"></div>

  <aside id="cartDrawer" aria-hidden="true">
    <div class="cart-drawer-header">
      <div style="font-weight:900;">购物车</div>
      <button type="button" class="cart-close-btn" id="cartCloseBtn">✕</button>
    </div>

    <div class="cart-drawer-body">
      <div style="font-size:12px;color:#6b7280; margin-bottom:10px;">
        共 <span id="cartTotalItems">0</span> 件
      </div>

      <div class="cart-empty" id="cartEmptyText" style="display:none;">
        购物车还是空的，快去挑点好东西～
      </div>

      <div class="cart-items" id="cartItemsList"></div>
    </div>

    <div class="cart-drawer-footer">
      <button type="button" class="cart-go-btn" id="goCartBtn">去购物车结算</button>
    </div>
  </aside>

  <!-- ✅ 脚本顺序：cart → renderer → page -->
  <script src="/user/assets/js/cart.js?v=11"></script>
  <script src="/user/assets/js/product_card_renderer.js?v=2"></script>
  <script src="/user/assets/js/Normal.js?v=2"></script>

  <!-- ✅ 自动算顶部高度 + 滚动阴影 -->
  <script>
    (function () {
      const nav = document.getElementById("topNav");
      if (!nav) return;

      function applyHeight() {
        const h = Math.ceil(nav.getBoundingClientRect().height || 0);
        document.documentElement.style.setProperty("--sticky-h", h + "px");
      }

      function onScroll() {
        if (window.scrollY > 4) nav.classList.add("is-scrolled");
        else nav.classList.remove("is-scrolled");
      }

      applyHeight();
      onScroll();

      window.addEventListener("resize", applyHeight, { passive: true });
      window.addEventListener("orientationchange", applyHeight, { passive: true });
      window.addEventListener("scroll", onScroll, { passive: true });
    })();
  </script>
  <script src="/shared/app-mobile.js?v=20260630-2"></script>
</body>
</html>
