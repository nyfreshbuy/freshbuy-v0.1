<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>司机端 - 今日路线</title>
    <style>
      :root {
        --bg: #0b1220;
        --card: rgba(255, 255, 255, 0.06);
        --line: rgba(148, 163, 184, 0.22);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --primary: #22c55e;
        --warn: #f59e0b;
        --danger: #ef4444;
        --radius: 16px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", sans-serif;
        background: radial-gradient(1200px 600px at 20% 0%, rgba(34,197,94,.18), transparent 55%),
                    radial-gradient(1000px 600px at 80% 10%, rgba(56,189,248,.15), transparent 60%),
                    var(--bg);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
      .topbar {
        display: flex; gap: 12px; align-items: center; justify-content: space-between;
        padding: 14px 14px;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.55);
        border-radius: var(--radius);
        backdrop-filter: blur(10px);
      }
      .left { display:flex; gap:12px; align-items:center; }
      .logo {
        width: 42px; height: 42px; border-radius: 14px;
        background: rgba(34,197,94,.18);
        border: 1px solid rgba(34,197,94,.35);
        display:flex; align-items:center; justify-content:center;
        font-weight: 900;
      }
      .hello { font-size: 14px; font-weight: 700; }
      .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .right { display:flex; gap: 8px; align-items:center; flex-wrap: wrap; justify-content: flex-end; }
      .btn {
        border: 1px solid var(--line);
        background: rgba(255,255,255,.06);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 13px;
        cursor: pointer;
      }
      .btn:hover { background: rgba(255,255,255,.10); }
      .btn.primary { border-color: rgba(34,197,94,.45); background: rgba(34,197,94,.16); }
      .btn.danger { border-color: rgba(239,68,68,.45); background: rgba(239,68,68,.12); }
      .grid { display: grid; grid-template-columns: 360px 1fr; gap: 12px; margin-top: 12px; }
      @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

      .card {
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.55);
        border-radius: var(--radius);
        padding: 14px;
      }
      .card h2 { margin: 0; font-size: 14px; }
      .muted { color: var(--muted); font-size: 12px; }
      .row { display:flex; gap: 8px; align-items:center; margin-top: 10px; flex-wrap: wrap; }
      .input, select {
        border: 1px solid var(--line);
        background: rgba(255,255,255,.06);
        color: var(--text);
        padding: 10px 10px;
        border-radius: 12px;
        font-size: 13px;
        outline: none;
      }
      select option { background: #0b1220; color: var(--text); }
      .pill {
        display:inline-flex; gap:6px; align-items:center;
        border: 1px solid var(--line);
        padding: 8px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: var(--muted);
        background: rgba(255,255,255,.04);
      }

      .msg {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        display:none;
        font-size: 13px;
      }
      .msg.ok { display:block; border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.12); }
      .msg.err { display:block; border-color: rgba(239,68,68,.45); background: rgba(239,68,68,.12); }

      .routeHead { display:flex; align-items:flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .routeTitle { font-size: 14px; font-weight: 800; }
      .routeSub { font-size: 12px; color: var(--muted); margin-top: 4px; }

      .stopList { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
      .stop {
        border: 1px solid var(--line);
        background: rgba(255,255,255,.05);
        border-radius: 14px;
        padding: 12px;
      }
      .stop-top {
        display:flex; gap:10px; justify-content: space-between; align-items:flex-start;
      }
      .stop h3 { margin: 0 0 6px 0; font-size: 14px; }
      .meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
      .actions { margin-top: 10px; display:flex; gap: 8px; flex-wrap: wrap; align-items:center; }
      .btn.mini { padding: 8px 10px; border-radius: 10px; font-size: 12px; }
      .btn.mini.primary { background: rgba(34,197,94,.16); border-color: rgba(34,197,94,.45); }
      .btn.mini.info { background: rgba(56,189,248,.12); border-color: rgba(56,189,248,.35); }
      .badge {
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,.06);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge.ok { border-color: rgba(34,197,94,.4); color: #86efac; background: rgba(34,197,94,.12); }
      .badge.warn { border-color: rgba(245,158,11,.45); color: #fcd34d; background: rgba(245,158,11,.12); }
      .badge.dim { opacity: .9; }

      .hint { color: var(--muted); font-size: 13px; padding: 10px 0; }
      code { color: #a5b4fc; }

      /* ✅ 起始地址小卡片（与整体风格一致） */
      .originBox {
        margin-top: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255,255,255,.04);
      }
      .originTitle { font-size: 13px; font-weight: 800; }
      .originHint { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.5; }
      .originActions { display:flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .btn.small { padding: 9px 10px; border-radius: 12px; font-size: 12px; }
    </style>
    <link rel="stylesheet" href="/shared/app-mobile.css?v=20260630-2" />
</head>

  <body>
    <div class="wrap">
      <div class="topbar">
        <div class="left">
          <div class="logo">🚚</div>
          <div>
            <div class="hello" id="hello">你好，司机</div>
            <div class="sub" id="driverSub">当前司机：-</div>
          </div>
        </div>

        <div class="right">
          <span class="pill">Token：<b id="tokenHint">?</b></span>
          <span class="pill">API：<b id="apiHint">-</b></span>
          <span class="pill">订单数：<b id="countHint">0</b></span>
          <button class="btn" id="btnPing">Ping</button>
          <button class="btn danger" id="btnLogout">退出</button>
        </div>
      </div>

      <div class="grid">
        <!-- 左侧：选择日期/批次 -->
        <div class="card">
          <h2>任务选择</h2>
          <div class="muted" style="margin-top:6px;">
            你可以按 <b>批次</b> 拉订单；如果批次接口不存在，也可以按 <b>日期</b> 拉订单。
          </div>

          <div class="row">
            <input class="input" id="dateInput" type="date" />
            <button class="btn" id="btnLoadBatches">加载批次</button>
          </div>

          <div class="row">
            <select id="batchSelect" style="min-width: 260px;">
              <option value="">（可选）先加载批次</option>
            </select>
          </div>

          <!-- ✅ 新增：起始地址（可编辑保存） -->
          <div class="originBox">
            <div class="originTitle">起始地址（可保存）</div>
            <div class="originHint">
              用于「全程导航」的出发点。保存后会记住，下次打开页面仍然保留。<br />
              示例：<code>199-26 48th Ave, Fresh Meadows, NY 11365</code>
            </div>

            <div class="row" style="margin-top:10px;">
              <input
                class="input"
                id="startAddressInput"
                type="text"
                placeholder="输入起始地址（仓库/自提点/司机出发地）"
                style="width:100%;"
              />
            </div>

            <div class="originActions">
              <button class="btn small primary" id="saveStartAddressBtn" type="button">保存起始地址</button>
              <button class="btn small" id="clearStartAddressBtn" type="button">清空</button>
            </div>
          </div>

          <div class="row">
            <button class="btn primary" id="btnLoadOrders">加载订单</button>
            <button class="btn" id="btnRefresh">刷新</button>
            <button class="btn" id="btnNavAll">全程导航</button>
          </div>

          <div class="msg ok" id="okBox"></div>
          <div class="msg err" id="errBox"></div>

          <div class="muted" style="margin-top:10px;">
            如果后台已派单但这里为空：通常是 <code>司机端接口没按 driver 过滤</code> 或 <code>页面还在跑旧 JS</code>。
          </div>
        </div>

        <!-- 右侧：路线列表 -->
        <div class="card">
          <div class="routeHead">
            <div>
              <div class="routeTitle">今日路线</div>
              <div class="routeSub" id="routeSub">未加载</div>
            </div>
          </div>

          <div id="stopList" class="stopList">
            <div class="hint">点击“加载订单”开始。</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ 关键：不要再引用旧的 driver_orders.js -->
    <script src="/driver/assets/js/driver_index.js?v=20260110"></script>
    <script src="/shared/app-mobile.js?v=20260630-2"></script>
</body>
</html>
